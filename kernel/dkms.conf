PACKAGE_NAME="mhvtl"
PACKAGE_VERSION="#MODULE_VERSION#"

BUILT_MODULE_NAME[0]="mhvtl"
DEST_MODULE_LOCATION[0]="/kernel/drivers/scsi"
AUTOINSTALL="yes"

# Build through the module's own Makefile so that config.h is regenerated for
# the target kernel. Passing KDIR overrides the running-kernel default and is
# re-exported to config.sh. The mhvtl.ko target is used instead of all, which
# would also rebuild the source tarball outside the DKMS build directory.
MAKE[0]="make KDIR=${kernel_source_dir} mhvtl.ko"
CLEAN="make clean"
